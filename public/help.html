<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dayspring Guide</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{
    --bg:#070916; --panel:rgba(22,26,56,.72); --panel2:rgba(34,40,80,.6); --edge:rgba(160,170,255,.14); --edge2:rgba(170,180,255,.28);
    --ink:#eef0ff; --muted:#a4abcc; --dim:#8d94b8; --violet:#a78bfa; --indigo:#7c8cff; --gold:#ffd27a; --mint:#7ee3b0; --rose:#ff8fa3;
    --ease:cubic-bezier(.2,.7,.2,1);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(1200px 700px at 20% -10%,rgba(124,140,255,.22),transparent 60%),radial-gradient(900px 600px at 110% 110%,rgba(167,139,250,.2),transparent 60%),var(--bg);
    color:var(--ink);font-family:Outfit,"Segoe UI",system-ui,sans-serif;font-size:clamp(14px,min(1.05vw,2.4vh),19px);display:flex;flex-direction:column;overflow:hidden}
  button,input{font:inherit;color:inherit}
  a{color:#b9c3ff}
  a:hover{color:#fff}

  /* top bar */
  .bar{display:flex;align-items:center;gap:.7em;padding:.7em 1.1em;border-bottom:1px solid var(--edge);flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:.55em;font-weight:500;font-size:1.2em;white-space:nowrap}
  .brand .dot{width:1.1em;height:1.1em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d8,#ffd27a 35%,#a78bfa 75%);box-shadow:0 0 18px rgba(255,210,122,.45)}
  .brand small{color:var(--muted);font-weight:300;font-size:.75em}
  .search{flex:1 1 auto;display:flex;min-width:0;max-width:34em;margin-left:auto;position:relative}
  .search input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--edge2);border-radius:.8em;padding:.45em .9em .45em 2.1em;outline:none}
  .search input:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(124,140,255,.25)}
  .search::before{content:"⌕";position:absolute;left:.7em;top:50%;transform:translateY(-52%);color:var(--muted);font-size:1.15em}
  .tool{background:rgba(255,255,255,.06);border:1px solid var(--edge2);border-radius:.7em;padding:.4em .8em;text-decoration:none;color:var(--ink);white-space:nowrap;cursor:pointer}
  .tool:hover{background:rgba(124,140,255,.28);color:#fff}
  #menuBtn{display:none}

  /* layout */
  .wrap{flex:1 1 auto;min-height:0;display:flex}
  nav#toc{flex:0 0 16.5em;overflow-y:auto;border-right:1px solid var(--edge);padding:.8em .6em 2em}
  nav#toc h2{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:1.1em .7em .4em;font-weight:500}
  nav#toc a{display:block;padding:.38em .7em;border-radius:.6em;text-decoration:none;color:var(--muted);line-height:1.3}
  nav#toc a:hover{background:rgba(255,255,255,.05);color:var(--ink)}
  nav#toc a.on{background:linear-gradient(135deg,rgba(124,140,255,.32),rgba(167,139,250,.26));color:#fff}
  nav#toc .sub{margin:.1em 0 .3em .9em;border-left:1px solid var(--edge2)}
  nav#toc .sub a{font-size:.86em;padding:.25em .7em}
  main{flex:1 1 auto;min-width:0;overflow-y:auto;scroll-behavior:smooth}
  article{max-width:46em;margin:0 auto;padding:1.6em 2em 5em;line-height:1.62;animation:in .3s var(--ease) both}
  @keyframes in{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}

  /* document */
  article h1{font-size:2em;font-weight:500;margin:.2em 0 .6em;line-height:1.2}
  article h2{font-size:1.38em;font-weight:500;margin:1.9em 0 .6em;padding-top:.3em;border-top:1px solid var(--edge)}
  article h3{font-size:1.12em;font-weight:500;margin:1.5em 0 .4em;color:#dfe3ff}
  article h4{font-size:1em;font-weight:600;margin:1.2em 0 .3em}
  article :is(h1,h2,h3,h4){scroll-margin-top:.8em}
  article :is(h2,h3) .anchor{opacity:0;margin-left:.35em;text-decoration:none;color:var(--dim);font-weight:300}
  article :is(h2,h3):hover .anchor{opacity:1}
  article p{margin:.7em 0}
  article ul,article ol{margin:.6em 0;padding-left:1.5em}
  article li{margin:.28em 0}
  article li>ul,article li>ol{margin:.2em 0}
  article li.task{list-style:none;margin-left:-1.3em}
  article li.task::before{content:"☐ ";color:var(--muted)}
  article li.task.done::before{content:"☑ ";color:var(--mint)}
  article strong{color:#fff;font-weight:600}
  article code{font-family:"Cascadia Mono",Consolas,monospace;font-size:.88em;background:rgba(124,140,255,.14);border:1px solid var(--edge);border-radius:.4em;padding:.08em .38em;word-break:break-word}
  article pre{position:relative;background:rgba(5,7,20,.75);border:1px solid var(--edge2);border-radius:.8em;padding:.9em 1em;overflow-x:auto;margin:.9em 0}
  article pre code{background:none;border:0;padding:0;font-size:.86em;white-space:pre;word-break:normal}
  article pre .copy{position:absolute;top:.45em;right:.45em;font-size:.75em;padding:.2em .6em;border-radius:.5em;background:rgba(255,255,255,.08);border:1px solid var(--edge2);cursor:pointer;color:var(--muted)}
  article pre .copy:hover{color:#fff;background:rgba(124,140,255,.3)}
  article hr{border:0;border-top:1px solid var(--edge);margin:2em 0}
  .table{overflow-x:auto;margin:1em 0;border:1px solid var(--edge2);border-radius:.8em}
  article table{border-collapse:collapse;width:100%;font-size:.93em}
  article th,article td{text-align:left;padding:.55em .8em;border-bottom:1px solid var(--edge);vertical-align:top}
  article td code{white-space:nowrap;word-break:normal}
  article th{background:rgba(124,140,255,.12);font-weight:500;color:#fff}
  article tr:last-child td{border-bottom:0}
  article blockquote{margin:1em 0;padding:.7em 1em .7em 1.1em;border-left:3px solid var(--edge2);background:rgba(255,255,255,.035);border-radius:0 .7em .7em 0;color:#dfe2f5}
  article blockquote p{margin:.35em 0}
  article blockquote ul{margin:.3em 0}
  article blockquote.tip{border-color:var(--mint);background:rgba(126,227,176,.07)}
  article blockquote.note{border-color:var(--indigo);background:rgba(124,140,255,.08)}
  article blockquote.warn{border-color:var(--gold);background:rgba(255,210,122,.08)}
  article blockquote.fix{border-color:var(--rose);background:rgba(255,143,163,.07)}
  article blockquote .label{display:inline-block;font-weight:600;margin-right:.25em}
  article blockquote.tip .label{color:var(--mint)} article blockquote.note .label{color:#b9c3ff}
  article blockquote.warn .label{color:var(--gold)} article blockquote.fix .label{color:var(--rose)}
  mark{background:rgba(255,210,122,.35);color:#fff;border-radius:.2em;padding:0 .1em}
  .flash{animation:flash 1.6s var(--ease)}
  @keyframes flash{0%,40%{background:rgba(255,210,122,.18)}100%{background:transparent}}

  /* page footer: previous / next */
  .pager{display:flex;gap:1em;margin-top:3em;padding-top:1.2em;border-top:1px solid var(--edge)}
  .pager a{flex:1;display:block;padding:.8em 1em;border:1px solid var(--edge2);border-radius:.8em;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.03)}
  .pager a:hover{background:rgba(124,140,255,.18)}
  .pager small{display:block;color:var(--muted);font-size:.8em}
  .pager .next{text-align:right}

  /* search results */
  .results h1{font-size:1.5em}
  .hit{display:block;padding:.8em 1em;border:1px solid var(--edge);border-radius:.8em;margin:.6em 0;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.03)}
  .hit:hover{background:rgba(124,140,255,.16);border-color:var(--edge2)}
  .hit b{display:block;font-weight:500}
  .hit small{color:var(--muted)}
  .hit .snip{display:block;color:#cfd3ee;font-size:.92em;margin-top:.25em}
  .empty{color:var(--muted)}

  /* phones and narrow windows */
  @media (max-width: 760px){
    body{font-size:15px}
    .bar{flex-wrap:wrap;padding:.6em 16px;gap:.5em}
    .search{order:3;flex:1 0 100%;max-width:none;margin:0}
    .brand small{display:none}
    #menuBtn{display:inline-block;margin-left:auto}
    .bar .tool.back{display:none}
    nav#toc{position:fixed;inset:0 25% 0 0;z-index:5;background:#0b0e22;box-shadow:12px 0 40px rgba(0,0,0,.6);transform:translateX(-105%);transition:transform .25s var(--ease)}
    body.menu nav#toc{transform:none}
    body.menu::after{content:"";position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.45)}
    article{padding:1.1em 16px 4em}
    article h1{font-size:1.6em}
    .pager{flex-direction:column}
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;scroll-behavior:auto!important} }
</style>
<script src="/theme-core.js"></script>
<script src="/theme.js"></script>
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="dot"></span>Dayspring <small>Guide</small></div>
    <label class="search"><input id="q" type="search" placeholder="Search the guide…  (press /)" autocomplete="off" aria-label="Search the guide"></label>
    <button class="tool" id="menuBtn" aria-label="Contents">☰ Contents</button>
    <a class="tool" href="/setup">⚙ Settings</a>
    <a class="tool back" href="/display" id="backLink">← Dayspring</a>
  </header>
  <div class="wrap">
    <nav id="toc" aria-label="Contents"></nav>
    <main id="main"><article id="doc"><p class="empty">Loading…</p></article></main>
  </div>
<script src="/help.js"></script>
</body>
</html>
