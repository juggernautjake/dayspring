<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayspring</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='20' r='9' fill='%236ea8fe'/%3E%3Crect x='2' y='20' width='28' height='10' fill='%230f1115'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1d2129; --card3:#242935; --line:#2a2f3a;
    --text:#e8eaed; --muted:#9aa3b2; --accent:#6ea8fe; --accent2:#7ee3b0;
    --warn:#ffcf6e; --pink:#f2a1c0; --purple:#c3a6f2; --danger:#ff8a80;
    --shadow:0 24px 60px -24px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.04);
  }
  /* Dark is the default. Light only when the OS asks for it AND the user hasn't picked dark,
     or when the user picks light explicitly. */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){ --bg:#f5f6f8; --card:#ffffff; --card2:#f0f2f6; --card3:#e6e9ef; --line:#e2e5ea;
      --text:#1c1f26; --muted:#5b6472; --accent:#2f6fed; --accent2:#1f9d63;
      --warn:#b7791f; --pink:#c74f86; --purple:#7c4fd0; --danger:#c62828;
      --shadow:0 24px 60px -24px rgba(20,30,60,.35), 0 0 0 1px rgba(0,0,0,.05); }
  }
  :root[data-theme="light"]{ --bg:#f5f6f8; --card:#ffffff; --card2:#f0f2f6; --card3:#e6e9ef; --line:#e2e5ea;
    --text:#1c1f26; --muted:#5b6472; --accent:#2f6fed; --accent2:#1f9d63;
    --warn:#b7791f; --pink:#c74f86; --purple:#7c4fd0; --danger:#c62828;
    --shadow:0 24px 60px -24px rgba(20,30,60,.35), 0 0 0 1px rgba(0,0,0,.05); }
  :root{color-scheme:dark}
  :root[data-theme="light"]{color-scheme:light}
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){color-scheme:light} }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.4;font-size:15px}
  button,input,select,textarea{font:inherit;color:inherit}
  /* dropdown lists follow the theme: a solid card color with full-strength text */
  select option,select optgroup{background:var(--card);color:var(--text)}
  select option:checked{background:var(--card3);color:var(--text)}
  button{cursor:pointer}
  svg.i{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  /* ---- layout: the day column fills the window; the assistant is a floating panel, or docked to the right ---- */
  .app{display:grid;grid-template-columns:minmax(0,1fr);height:100vh}
  body.docked .app{grid-template-columns:minmax(0,1fr) var(--dock-w,420px)}
  .day{overflow:auto;padding:22px 20px 60px}

  /* ---- day column ---- */
  .dayhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .dayhead .titlebox{flex:1 1 auto;min-width:0}
  .dayhead h1{font-size:1.45rem;margin:0;line-height:1.15;text-wrap:balance}
  .dayhead .sub{color:var(--muted);font-size:.86rem;margin:2px 0 0}
  .seg{position:relative;display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;isolation:isolate}
  .seg button{position:relative;z-index:1;background:none;border:none;padding:6px 13px;border-radius:8px;font-size:.84rem;font-weight:600;color:var(--muted);transition:color .2s}
  .seg button.on{color:#0f1115}
  .seg__pill{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:8px;background:var(--accent);transition:left .25s cubic-bezier(.4,0,.2,1),width .25s cubic-bezier(.4,0,.2,1);z-index:0}
  .viewport{position:relative}
  .view{animation:none}
  .view.in-fade{animation:vfade .28s ease-out both}
  .view.in-left{animation:vleft .3s cubic-bezier(.2,.7,.2,1) both}
  .view.in-right{animation:vright .3s cubic-bezier(.2,.7,.2,1) both}
  @keyframes vfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes vleft{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
  @keyframes vright{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
  .summary{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.82rem;margin:2px 0 14px}
  .summary b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .summary .bar{flex:1 1 140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;align-self:center;min-width:120px}
  .summary .bar i{display:block;height:100%;background:var(--accent2);width:0;transition:width .5s ease-out}

  /* week: a time grid, 6 am to 11 pm */
  .wk{--h:44px;--top:6;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .wk__head{display:grid;grid-template-columns:54px repeat(7,1fr);border-bottom:1px solid var(--line);background:var(--card2)}
  .wk__head button{background:none;border:none;border-left:1px solid var(--line);padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.74rem;transition:background-color .15s}
  .wk__head button:hover{background:var(--card3)}
  .wk__head button b{color:var(--text);font-size:1.05rem;font-variant-numeric:tabular-nums;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;transition:background-color .2s}
  .wk__head button.today b{background:var(--accent);color:#0f1115}
  .wk__head button.sel{background:rgba(110,168,254,.1)}
  .wk__head small{font-size:.68rem;color:var(--muted)}
  .wk__body{display:grid;grid-template-columns:54px repeat(7,1fr);max-height:calc(100vh - 260px);overflow:auto;position:relative}
  .wk__gutter{position:relative;height:calc(var(--h) * 17)}
  .wk__gutter span{position:absolute;right:8px;transform:translateY(-50%);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .wk__col{position:relative;height:calc(var(--h) * 17);border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--h);transition:background-color .15s}
  .wk__col.today{background-color:rgba(110,168,254,.05)}
  .wk__col:hover{background-color:rgba(110,168,254,.07)}
  .wk__ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:4px 7px;font-size:.74rem;line-height:1.25;overflow:hidden;cursor:pointer;border:1px solid transparent;border-left-width:3px;background:var(--card2);transition:transform .15s,box-shadow .15s,filter .15s;animation:vfade .3s ease-out both}
  .wk__ev:hover{transform:translateY(-1px);box-shadow:0 8px 20px -12px rgba(0,0,0,.7);filter:brightness(1.08);z-index:2}
  .wk__ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wk__ev small{color:var(--muted);font-variant-numeric:tabular-nums}
  .wk__ev.done{opacity:.5}.wk__ev.done b{text-decoration:line-through}
  .wk__now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:3;pointer-events:none}
  .wk__now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
  .c-faith{border-color:var(--pink);background:rgba(242,161,192,.14)}
  .c-home,.c-meal{border-color:var(--accent2);background:rgba(126,227,176,.14)}
  .c-body,.c-rest{border-color:var(--accent);background:rgba(110,168,254,.14)}
  .c-work,.c-study{border-color:var(--purple);background:rgba(195,166,242,.16)}
  .c-flex{border-color:var(--warn);background:rgba(255,207,110,.14)}

  /* month: a classic grid with chips and a done bar per day */
  .mo__dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .mo__dow span{text-align:center;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .mo{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .mo__cell{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:104px;padding:7px 8px 8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;color:inherit;transition:border-color .15s,transform .15s,box-shadow .15s;animation:vfade .35s ease-out both;position:relative}
  .mo__cell:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(0,0,0,.7)}
  .mo__cell.other{opacity:.45}
  .mo__cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .mo__cell.sel{background:var(--card2)}
  .mo__d{font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center}
  .mo__cell.today .mo__d span:first-child{background:var(--accent);color:#0f1115;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
  .mo__d small{font-weight:600;color:var(--muted);font-size:.68rem}
  .mo__chip{font-size:.7rem;line-height:1.25;padding:2px 6px;border-radius:6px;border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card2)}
  .mo__chip.done{opacity:.5;text-decoration:line-through}
  .mo__more{font-size:.68rem;color:var(--muted);padding-left:6px}
  .mo__bar{margin-top:auto;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
  .mo__bar i{display:block;height:100%;background:var(--accent2);transition:width .5s ease-out}
  @media (max-width:700px){.mo__cell{min-height:64px;padding:5px 6px}.mo__chip,.mo__more{display:none}}

  /* year: twelve small months, cells shaded by how full and how done the day was */
  .yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .yr__m{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;animation:vfade .35s ease-out both;transition:border-color .15s,transform .15s}
  .yr__m:hover{border-color:var(--accent)}
  .yr__m h3{margin:0 0 8px;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
  .yr__m h3 button{background:none;border:none;padding:0;font:inherit;font-weight:700;color:var(--text)}
  .yr__m h3 button:hover{color:var(--accent)}
  .yr__m h3 small{color:var(--muted);font-weight:500;font-size:.72rem;font-variant-numeric:tabular-nums}
  .yr__g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .yr__g span{font-size:.6rem;color:var(--muted);text-align:center;text-transform:uppercase}
  .yr__g button{aspect-ratio:1;border-radius:5px;border:1px solid transparent;background:var(--card2);padding:0;font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums;transition:transform .12s,border-color .12s}
  .yr__g button:hover{transform:scale(1.15);border-color:var(--accent);z-index:1;position:relative}
  .yr__g button.l1{background:rgba(110,168,254,.22);color:var(--text)}
  .yr__g button.l2{background:rgba(110,168,254,.42);color:var(--text)}
  .yr__g button.l3{background:rgba(110,168,254,.65);color:#0f1115}
  .yr__g button.l4{background:var(--accent);color:#0f1115}
  .yr__g button.done{background:rgba(126,227,176,.6);color:#0f1115}
  .yr__g button.today{outline:2px solid var(--danger);outline-offset:-1px}
  .yr__g button.blank{background:transparent;pointer-events:none}
  @media (prefers-reduced-motion: reduce){.view,.wk__ev,.mo__cell,.yr__m{animation:none!important}.seg__pill{transition:none}}
  .nav{display:flex;gap:6px}
  .btn{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:.86rem;transition:border-color .15s,background-color .15s,transform .1s}
  .btn:hover{border-color:var(--accent)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0f1115;font-weight:600}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--danger)}
  .btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 16px}
  .week button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 4px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
  .week button b{color:var(--text);font-size:1rem;font-variant-numeric:tabular-nums}
  .week button .dots{display:flex;gap:2px;height:6px}
  .week button .dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
  .week button.sel{border-color:var(--accent);background:var(--card2)}
  .week button.today b{color:var(--accent)}

  .nextup{background:linear-gradient(90deg,rgba(110,168,254,.16),rgba(126,227,176,.10));
    border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.92rem}
  .nextup b{color:var(--accent)}
  .nextup .cd{color:var(--muted);font-size:.84rem;margin-top:2px}

  .sect{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;margin:20px 0 8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start;position:relative}
  .block.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .block.done{opacity:.55}
  .block.done .title{text-decoration:line-through}
  .block.meal{border-left:4px solid var(--accent2)}
  .block.past:not(.done){opacity:.8}
  .time{flex:0 0 118px;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600;font-size:.86rem;color:var(--accent);padding-top:2px}
  .body{flex:1;min-width:0}
  .title{font-weight:600;margin:0 0 2px;font-size:.98rem}
  .desc{color:var(--muted);font-size:.85rem;margin:0}
  .tag{display:inline-block;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle;font-weight:700}
  .t-home{background:rgba(126,227,176,.16);color:var(--accent2)}
  .t-body,.t-rest,.t-meal{background:rgba(110,168,254,.16);color:var(--accent)}
  .t-work,.t-study{background:rgba(195,166,242,.18);color:var(--purple)}
  .t-faith{background:rgba(242,161,192,.16);color:var(--pink)}
  .t-flex{background:rgba(255,207,110,.16);color:var(--warn)}
  .t-clash{background:rgba(255,138,128,.18);color:var(--danger)}
  .block.clash{border-color:rgba(255,138,128,.55)}
  .conflict{background:rgba(255,138,128,.10);border:1px solid rgba(255,138,128,.45);border-left:4px solid var(--danger);
    border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.9rem}
  .conflict .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .block input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
  .block .edit{position:absolute;top:8px;right:10px;opacity:0;font-size:.78rem}
  .block:hover .edit,.block:focus-within .edit{opacity:1}
  .empty{color:var(--muted);font-size:.9rem;padding:20px 0}

  .form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .form input,.form select,.form textarea{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:.88rem;width:100%}
  .form .c6{grid-column:span 6}.form .c3{grid-column:span 3}.form .c2{grid-column:span 2}
  .form .row{grid-column:span 6;display:flex;gap:8px;justify-content:flex-end}
  @media (max-width:600px){.form .c3,.form .c2{grid-column:span 6}}

  /* ---- the assistant panel ----
     Floating by default: drag it by the header, resize from the corner, sizes remembered. "Dock" pins
     it to the right edge as a column; the day view makes room. "Minimize" folds it to a pill. */
  .dock{position:fixed;right:24px;bottom:24px;width:440px;height:640px;min-width:340px;min-height:380px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);
    display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;z-index:50;
    transition:box-shadow .2s}
  .dock.dragging{box-shadow:0 34px 80px -24px rgba(0,0,0,.85), 0 0 0 1px var(--accent);transition:none;user-select:none}
  body.docked .dock{position:static;width:auto;height:100vh;max-height:none;border-radius:0;border-width:0 0 0 1px;box-shadow:none}
  .dock.min{height:auto!important;min-height:0;width:auto!important;min-width:0}
  .dock.min > :not(.dock__head){display:none}
  .dock__head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line);background:var(--card2);cursor:grab;flex:0 0 auto}
  .dock.min .dock__head{border-bottom:none;cursor:pointer}
  body.docked .dock__head{cursor:default}
  .dock.dragging .dock__head{cursor:grabbing}
  .dock__brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .dock__brand svg{width:22px;height:22px}
  .dock__title{font-weight:700;font-size:.95rem;letter-spacing:.01em;white-space:nowrap}
  .dock__state{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dock__state .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px rgba(126,227,176,.18);flex:0 0 auto}
  .dock__state.bad .dot{background:var(--warn);box-shadow:0 0 0 3px rgba(255,207,110,.18)}
  .dock__clock{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .dock__acts{display:flex;gap:2px;flex:0 0 auto}
  .ib{width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;transition:background-color .15s,color .15s,border-color .15s}
  .ib:hover{background:var(--card3);color:var(--text);border-color:var(--line)}
  .ib.on{color:var(--accent);background:rgba(110,168,254,.12)}
  .ib svg.i{width:17px;height:17px}

  .tabs{display:flex;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line);flex:0 0 auto}
  .tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:none;padding:9px 6px 11px;color:var(--muted);font-size:.82rem;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:8px 8px 0 0;transition:color .15s,background-color .15s}
  .tabs button:hover{color:var(--text);background:var(--card2)}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .tabs button svg.i{width:16px;height:16px}
  @container dock (max-width: 400px){ .tabs button span{display:none} }
  .dock{container-type:inline-size;container-name:dock}

  .pane{flex:1;overflow:auto;padding:14px 16px;display:none;min-height:0}
  .pane.on{display:block}
  #pane-chat.on{display:flex;flex-direction:column;padding:0}

  .log{flex:1;overflow:auto;padding:16px 16px 10px;display:flex;flex-direction:column;gap:12px;min-height:0;scroll-behavior:smooth}
  .log::-webkit-scrollbar{width:10px}.log::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--card)}
  .hint{color:var(--muted);font-size:.84rem;text-align:center;padding:26px 18px 10px;line-height:1.6}
  .hint b{color:var(--text);font-weight:600}
  .hint .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
  .hint .chips button{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.78rem;color:var(--text)}
  .hint .chips button:hover{border-color:var(--accent)}
  .msg{display:flex;gap:9px;align-items:flex-end;max-width:100%;animation:rise .22s ease-out both}
  .msg .av{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:var(--card3);color:var(--accent);margin-bottom:16px}
  .msg .av svg{width:15px;height:15px}
  .msg .bub{max-width:min(86%,560px);padding:9px 13px;border-radius:16px;font-size:.92rem;white-space:pre-wrap;line-height:1.45;word-break:break-word}
  .msg .meta{font-size:.68rem;color:var(--muted);margin:3px 6px 0;font-variant-numeric:tabular-nums}
  .msg.me{flex-direction:row-reverse;align-self:flex-end}
  .msg.me .bub{background:var(--accent);color:#0f1115;border-bottom-right-radius:5px}
  .msg.me .meta{text-align:right}
  .msg.ai{align-self:flex-start}
  .msg.ai .bub{background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.sys{align-self:center;flex-direction:column;align-items:center;gap:0}
  .msg.sys .bub{background:none;color:var(--muted);font-size:.78rem;padding:2px 10px;text-align:center}
  .msg.sys.warn .bub{background:rgba(255,207,110,.12);border:1px solid rgba(255,207,110,.4);color:var(--text);border-radius:10px;padding:8px 12px}
  .msg.interim .bub{opacity:.65;font-style:italic}
  .msg.ai.interim .bub{font-style:normal}
  .typing{display:inline-flex;gap:4px;align-items:center;height:1.1em}
  .typing i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45;animation:dots 1.1s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes dots{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}

  .composer{border-top:1px solid var(--line);padding:10px 12px 8px;display:flex;gap:8px;align-items:flex-end;flex:0 0 auto;background:var(--card)}
  .composer .field{flex:1;display:flex;align-items:flex-end;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 12px;transition:border-color .15s,box-shadow .15s}
  .composer .field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,168,254,.15)}
  .composer textarea{flex:1;background:none;border:none;padding:7px 0;resize:none;min-height:34px;max-height:160px;font-size:.92rem;outline:none;line-height:1.4}
  .composer textarea::placeholder{color:var(--muted)}
  .mic{width:38px;height:38px;border-radius:11px;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;flex:0 0 auto;transition:background-color .15s,color .15s}
  .mic:hover{background:var(--card3);color:var(--text)}
  .mic.live{background:var(--danger);color:#fff;animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,138,128,.5)}100%{box-shadow:0 0 0 12px rgba(255,138,128,0)}}
  .send{width:42px;height:42px;border-radius:13px;border:none;background:var(--accent);color:#0f1115;display:grid;place-items:center;flex:0 0 auto;transition:transform .1s,filter .15s}
  .send:hover{filter:brightness(1.08)}.send:active{transform:scale(.96)}
  .send:disabled{opacity:.5;cursor:default}

  .voicebar{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted);flex:0 0 auto}
  .sw{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;cursor:pointer;user-select:none;transition:border-color .15s,background-color .15s}
  .sw input{appearance:none;width:26px;height:15px;border-radius:999px;background:var(--line);position:relative;margin:0;transition:background-color .15s;cursor:pointer}
  .sw input::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--card);transition:transform .15s}
  .sw input:checked{background:var(--accent)}
  .sw input:checked::after{transform:translateX(11px);background:#0f1115}
  .sw:has(input:checked){border-color:rgba(110,168,254,.5);color:var(--text)}
  .voicebar .vsel{margin-left:auto;display:flex;align-items:center;gap:6px;min-width:0}
  .voicebar select{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.78rem;max-width:180px;text-overflow:ellipsis}

  .grip{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;color:var(--muted);opacity:.7;display:grid;place-items:center}
  .grip svg{width:12px;height:12px}
  body.docked .grip,.dock.min .grip{display:none}
  .edgegrip{position:absolute;left:0;top:0;bottom:0;width:6px;cursor:ew-resize;display:none}
  body.docked .edgegrip{display:block}

  .list{display:flex;flex-direction:column;gap:8px}
  .item{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
  .item .grow{flex:1;min-width:0}
  .item small{display:block;color:var(--muted);font-size:.78rem}
  .item input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin-top:2px}
  .item .x{background:none;border:none;color:var(--muted);font-size:1rem;padding:0 2px}
  .item .x:hover{color:var(--danger)}
  .mini{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
  .mini input,.mini select{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.84rem;width:100%}
  .mini .full{grid-column:span 2}
  .days{display:flex;gap:4px;grid-column:span 2;flex-wrap:wrap}
  .days label{font-size:.74rem;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;display:flex;gap:3px;align-items:center}
  kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:0 4px}

  @media (max-width:700px){
    .dock{left:8px;right:8px;bottom:8px;width:auto!important;height:min(70vh,640px)!important;max-width:none}
    body.docked .app{grid-template-columns:minmax(0,1fr)}
    body.docked .dock{position:fixed;height:min(70vh,640px)!important;border-radius:18px;border-width:1px;box-shadow:var(--shadow)}
  }
  @media (prefers-reduced-motion: reduce){.msg,.typing i,.mic.live{animation:none}.log{scroll-behavior:auto}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-sun" viewBox="0 0 24 24"><path d="M5 17h14"/><path d="M8 17a4 4 0 0 1 8 0"/><path d="M12 8V5"/><path d="M6.3 10.3 4.2 8.2"/><path d="m17.7 10.3 2.1-2.1"/><path d="M3 21h18"/></symbol>
  <symbol id="ic-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.2A8 8 0 1 1 21 12z"/></symbol>
  <symbol id="ic-tasks" viewBox="0 0 24 24"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="m3.5 6 1 1 2-2"/><path d="m3.5 12 1 1 2-2"/><path d="m3.5 18 1 1 2-2"/></symbol>
  <symbol id="ic-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
  <symbol id="ic-brain" viewBox="0 0 24 24"><path d="M9.5 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5.2 3 3 0 0 0 1.2 5.3A3 3 0 0 0 9.5 21a2.5 2.5 0 0 0 2.5-2.5v-13A2.5 2.5 0 0 0 9.5 3z"/><path d="M14.5 3a3 3 0 0 1 3 3 3 3 0 0 1 2 5.2 3 3 0 0 1-1.2 5.3A3 3 0 0 1 14.5 21a2.5 2.5 0 0 1-2.5-2.5v-13A2.5 2.5 0 0 1 14.5 3z"/></symbol>
  <symbol id="ic-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></symbol>
  <symbol id="ic-send" viewBox="0 0 24 24"><path d="M4 12 20 4l-4 16-4-7z"/><path d="M20 4 12 13"/></symbol>
  <symbol id="ic-min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="ic-dock" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
  <symbol id="ic-float" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="11" y="10" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="ic-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="ic-sunny" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="ic-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ic-grip" viewBox="0 0 24 24"><path d="M21 15v6h-6"/><path d="M21 21 9 9"/><path d="M21 9v2M13 21h2"/></symbol>
</svg>

<div class="app">
  <section class="day" id="day">
    <div class="dayhead">
      <div class="titlebox"><h1 id="dayTitle">Today</h1><p class="sub" id="daySub"></p></div>
      <div class="nav">
        <button class="btn" id="prevDay" title="Previous (←)">‹</button>
        <button class="btn" id="todayBtn">Today</button>
        <button class="btn" id="nextDay" title="Next (→)">›</button>
      </div>
      <div class="seg" id="viewSeg" role="tablist" aria-label="View">
        <button data-view="day" class="on" role="tab" title="Day (D)">Day</button>
        <button data-view="week" role="tab" title="Week (W)">Week</button>
        <button data-view="month" role="tab" title="Month (M)">Month</button>
        <button data-view="year" role="tab" title="Year (Y)">Year</button>
        <i class="seg__pill" aria-hidden="true"></i>
      </div>
    </div>
    <div class="viewport" id="viewport">
    <div class="view" id="view-day">
    <div class="week" id="week"></div>
    <div class="nextup" id="nextup" hidden></div>
    <div class="conflict" id="conflict" hidden></div>
    <div class="sect"><span>Schedule <span class="tag t-clash" id="clashcount" hidden></span></span><span><button class="btn ghost" id="applyRoutines">Stamp routines</button> <button class="btn ghost" id="showAdd">+ Add block</button></span></div>
    <form class="form" id="addForm" hidden>
      <input class="c6" name="title" placeholder="Title" required>
      <input class="c2" name="date" type="date" required>
      <input class="c2" name="start" type="time" required>
      <input class="c2" name="end" type="time" required>
      <select class="c3" name="category"></select>
      <label class="c3" style="display:flex;align-items:center;gap:6px;font-size:.86rem;color:var(--muted)"><input type="checkbox" name="flexible" style="width:16px;height:16px"> Flexible (can slide)</label>
      <textarea class="c6" name="description" rows="2" placeholder="Description (optional)"></textarea>
      <div class="row"><button type="button" class="btn ghost" id="cancelAdd">Cancel</button><button class="btn primary" type="submit">Add</button></div>
    </form>
    <div id="blocks"></div>
    </div>
    <div class="view" id="view-week" hidden></div>
    <div class="view" id="view-month" hidden></div>
    <div class="view" id="view-year" hidden></div>
    </div>
  </section>

  <aside class="dock" id="dock" role="dialog" aria-label="Dayspring assistant">
    <div class="dock__head" id="dockHead">
      <div class="dock__brand">
        <svg class="i" aria-hidden="true"><use href="#ic-sun"/></svg>
        <div style="min-width:0">
          <div class="dock__title">Dayspring</div>
          <div class="dock__state" id="keyStatusWrap"><span class="dot"></span><span id="keyStatus">…</span></div>
        </div>
      </div>
      <span class="dock__clock" id="clock"></span>
      <div class="dock__acts">
        <a class="ib" href="/setup" target="_blank" rel="noopener" title="Settings" style="text-decoration:none;display:grid;place-items:center">⚙</a>
        <a class="ib" href="/help" target="_blank" rel="noopener" title="Help" style="text-decoration:none;display:grid;place-items:center;font-weight:600">?</a>
        <button class="ib" id="theme" title="Theme: dark"><svg class="i"><use href="#ic-moon"/></svg></button>
        <button class="ib" id="dockToggle" title="Dock to the side"><svg class="i"><use href="#ic-dock"/></svg></button>
        <button class="ib" id="minToggle" title="Minimize"><svg class="i"><use href="#ic-min"/></svg></button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="on" data-tab="chat" role="tab"><svg class="i"><use href="#ic-chat"/></svg><span>Assistant</span></button>
      <button data-tab="tasks" role="tab"><svg class="i"><use href="#ic-tasks"/></svg><span>Tasks</span></button>
      <button data-tab="routines" role="tab"><svg class="i"><use href="#ic-repeat"/></svg><span>Routines</span></button>
      <button data-tab="memory" role="tab"><svg class="i"><use href="#ic-brain"/></svg><span>Memory</span></button>
    </div>

    <div class="pane on" id="pane-chat">
      <div class="log" id="log">
        <div class="hint" id="hint">
          <b>Ask what's next, add or move blocks, or plan a day.</b><br>
          Click the mic or hold <kbd>Space</kbd> to talk.
          <div class="chips">
            <button type="button" data-say="What's next?">What's next?</button>
            <button type="button" data-say="Plan my afternoon">Plan my afternoon</button>
            <button type="button" data-say="Move gym to four and push study to tonight">Move gym to four</button>
            <button type="button" data-say="What did I get done today?">What did I get done?</button>
          </div>
        </div>
      </div>
      <div class="composer">
        <div class="field">
          <textarea id="input" rows="1" placeholder="Message Dayspring…"></textarea>
          <button class="mic" id="mic" title="Talk (or hold Space)"><svg class="i"><use href="#ic-mic"/></svg></button>
        </div>
        <button class="send" id="send" title="Send (Enter)"><svg class="i"><use href="#ic-send"/></svg></button>
      </div>
      <div class="voicebar">
        <label class="sw"><input type="checkbox" id="speak" checked> Speak replies</label>
        <label class="sw"><input type="checkbox" id="handsfree"> Hands-free</label>
        <label class="sw"><input type="checkbox" id="wake"> Wake word</label>
        <label class="vsel">Voice <select id="voice"></select></label>
      </div>
    </div>

    <div class="pane" id="pane-tasks">
      <div class="list" id="tasks"></div>
      <form class="mini" id="taskForm">
        <input class="full" name="title" placeholder="New task" required>
        <select name="category"></select>
        <input name="dueDate" type="date">
        <button class="btn primary full" type="submit">Add task</button>
      </form>
    </div>

    <div class="pane" id="pane-routines">
      <div class="list" id="routines"></div>
      <form class="mini" id="routineForm">
        <input class="full" name="title" placeholder="New routine" required>
        <input name="start" type="time" required><input name="end" type="time" required>
        <select name="category" class="full"></select>
        <div class="days" id="routineDays"></div>
        <button class="btn primary full" type="submit">Add routine</button>
      </form>
    </div>

    <div class="pane" id="pane-memory">
      <div class="list" id="memories"></div>
      <p class="empty" style="font-size:.8rem">Things the assistant has saved about you. Tell it "remember that…" to add one.</p>
    </div>
    <div class="grip" id="grip" title="Resize"><svg class="i"><use href="#ic-grip"/></svg></div>
    <div class="edgegrip" id="edgegrip" title="Resize"></div>
  </aside>
</div>
<script>
  // Apply the saved theme before first paint. Default is dark.
  (function(){ var t; try { t = localStorage.getItem("ds.theme"); } catch(e){}
    document.documentElement.setAttribute("data-theme", t || "dark");
    var d; try { d = localStorage.getItem("ds.dock.mode"); } catch(e){}
    if (d === "docked") document.body.classList.add("docked"); })();
</script>
<script src="app.js"></script>
<script src="dock.js"></script>
</body>
</html>
