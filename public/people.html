<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayspring People</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='20' r='9' fill='%237c8cff'/%3E%3Crect x='2' y='20' width='28' height='10' fill='%23070913'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{--bg:#070913;--ink:#eef0ff;--muted:#a4abcc;--dim:#8d94b8;--glass:rgba(22,26,52,.55);--edge:rgba(160,170,255,.14);--edge2:rgba(170,180,255,.28);--indigo:#7c8cff;--violet:#a78bfa;--mint:#7ee3b0;--bad:#ff8fa3;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:Outfit,"Segoe UI",sans-serif;font-weight:300;background:radial-gradient(1200px 700px at 15% -10%,rgba(91,108,255,.28),transparent 60%),var(--bg);background-attachment:fixed}
  main{max-width:1100px;margin:0 auto;padding:28px 16px 80px}
  h1{font-weight:300;font-size:2rem;margin:0 0 4px}
  h2{font-weight:400;font-size:1.15rem;margin:1.4em 0 .5em;color:#cfd5ff}
  .sub{color:var(--muted);margin:0 0 18px}
  .wrap{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px}
  @media (max-width:760px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:14px 16px;backdrop-filter:blur(14px)}
  .list button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:12px;color:var(--ink);font:inherit;padding:8px;cursor:pointer}
  .list button:hover,.list button[aria-current=true]{border-color:var(--edge2);background:rgba(124,140,255,.08)}
  .av{width:40px;height:40px;border-radius:50%;background:rgba(124,140,255,.2);display:grid;place-items:center;flex:0 0 40px;overflow:hidden;font-weight:500}
  .av img{width:100%;height:100%;object-fit:cover}
  .big .av{width:84px;height:84px;flex-basis:84px;font-size:1.8rem}
  .muted{color:var(--muted)} .small{font-size:.88rem}
  input,select{background:rgba(0,0,0,.25);border:1px solid var(--edge2);border-radius:10px;color:var(--ink);font:inherit;padding:8px 10px}
  button.b{background:linear-gradient(135deg,var(--indigo),var(--violet));border:none;border-radius:10px;padding:8px 14px;color:#fff;font:inherit;cursor:pointer}
  button.g{background:none;border:1px solid var(--edge2);border-radius:10px;padding:7px 12px;color:var(--ink);font:inherit;cursor:pointer}
  button.d{background:rgba(255,143,163,.12);border:1px solid rgba(255,143,163,.4);border-radius:10px;padding:7px 12px;color:var(--bad);font:inherit;cursor:pointer}
  ul{margin:.2em 0;padding-left:1.1em} li{margin:.2em 0}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px} .thumbs img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--edge)}
  .msgs{max-height:340px;overflow:auto} .msg{margin:.35em 0;padding:.4em .6em;border-radius:10px;background:rgba(255,255,255,.04);max-width:85%} .msg.out{margin-left:auto;background:rgba(124,140,255,.14)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grp{display:flex;gap:10px;align-items:center;margin:.4em 0}
</style>
<script src="/theme-core.js"></script>
<script src="/theme.js"></script>
</head>
<body>
<main>
  <h1>People</h1>
  <p class="sub">Everyone Dayspring knows about, on this computer only. Faces, saved messages and calls are encrypted with your Windows account.</p>
  <div class="wrap">
    <div>
      <div class="card list" id="list" aria-label="People">Loading…</div>
      <div class="card" id="groups" style="margin-top:14px" hidden></div>
      <div class="card" id="questions" style="margin-top:14px" hidden></div>
    </div>
    <div class="card" id="profile"><p class="muted">Pick someone on the left.</p></div>
  </div>
</main>
<script src="/gallery.js"></script>
<script src="/people.js"></script>
</body>
</html>
