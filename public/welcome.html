<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to Dayspring</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='20' r='9' fill='%237c8cff'/%3E%3Crect x='2' y='20' width='28' height='10' fill='%23070913'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{
    --bg:#070916; --panel:rgba(22,26,56,.72); --panel2:rgba(34,40,80,.6); --edge:rgba(160,170,255,.14); --edge2:rgba(170,180,255,.28);
    --ink:#eef0ff; --muted:#a4abcc; --dim:#8d94b8; --violet:#a78bfa; --indigo:#7c8cff; --gold:#ffd27a; --mint:#7ee3b0; --rose:#ff8fa3;
    --ease:cubic-bezier(.2,.7,.2,1); --r:.9em;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(1200px 700px at 15% -10%,rgba(124,140,255,.25),transparent 60%),radial-gradient(900px 600px at 110% 110%,rgba(167,139,250,.22),transparent 60%),radial-gradient(700px 500px at 70% 10%,rgba(255,210,122,.08),transparent 60%),var(--bg);
    color:var(--ink);font-family:Outfit,"Segoe UI",system-ui,sans-serif;font-size:clamp(15px,min(1.2vw,2.5vh),19px);line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:#b8c1ff}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ---------- top: brand, where you are ---------- */
  .top{display:flex;align-items:center;gap:1em;padding:.65em 1.2em;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:.55em;font-weight:500;font-size:1.1em;white-space:nowrap}
  .sun{width:1.55em;height:1.55em;border-radius:50%;background:radial-gradient(circle at 50% 70%,#ffd27a,#a78bfa 70%);box-shadow:0 0 18px rgba(167,139,250,.6)}
  .rail{flex:1;display:flex;gap:.3em;align-items:center;justify-content:center;min-width:0;overflow:hidden}
  .rail i{height:.4em;flex:1 1 0;max-width:3.2em;border-radius:1em;background:rgba(255,255,255,.1);transition:background .4s}
  .rail i.done{background:linear-gradient(90deg,var(--indigo),var(--violet))}
  .rail i.now{background:var(--gold);box-shadow:0 0 10px rgba(255,210,122,.6)}
  .stepname{color:var(--muted);font-size:.85em;white-space:nowrap}
  .top .link{background:none;border:1px solid transparent;border-radius:.6em;color:var(--dim);cursor:pointer;padding:.25em .6em;font-size:.85em;white-space:nowrap}
  .top .link:hover{color:var(--ink);border-color:var(--edge2)}

  /* ---------- the guide: who's talking, what he said, and his controls ---------- */
  .guide{display:flex;align-items:center;gap:.9em;margin:0 auto;width:min(58em,calc(100% - 2em));padding:.7em .9em;background:var(--panel);border:1px solid var(--edge2);border-radius:1.2em;backdrop-filter:blur(14px);flex:0 0 auto}
  .orb{position:relative;flex:0 0 3.1em;height:3.1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#c9c2ff 18%,#7c8cff 55%,#3b2a8a 100%);box-shadow:0 0 22px rgba(124,140,255,.55)}
  .orb::after{content:"";position:absolute;inset:-.35em;border-radius:50%;border:2px solid rgba(167,139,250,.0);transition:border-color .3s}
  .guide.talking .orb{animation:breathe 1.2s ease-in-out infinite}
  .guide.talking .orb::after{border-color:rgba(167,139,250,.55);animation:ring 1.4s ease-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
  .cap{flex:1;min-width:0}
  .cap small{display:block;color:var(--violet);font-size:.75em;letter-spacing:.08em;text-transform:uppercase}
  .cap p{margin:.1em 0 0;font-size:1em;color:var(--ink);max-height:4.6em;overflow-y:auto;scroll-behavior:smooth;overflow-wrap:anywhere}
  .cap p:has(.now) span{opacity:.55;transition:opacity .3s} .cap p span.now{opacity:1}
  .gbtns{display:flex;gap:.35em;flex:0 0 auto}
  .gbtn{width:2.5em;height:2.5em;border-radius:50%;border:1px solid var(--edge2);background:rgba(255,255,255,.06);cursor:pointer;display:grid;place-items:center;font-size:1em;transition:background .2s}
  .gbtn:hover{background:rgba(124,140,255,.3)}
  .gbtn[aria-pressed=true]{background:rgba(255,143,163,.22);border-color:rgba(255,143,163,.5)}

  /* ---------- the step ---------- */
  main{flex:1 1 auto;min-height:0;overflow-y:auto;padding:1.1em 1em 1.6em;scroll-behavior:smooth}
  .card{width:min(58em,100%);margin:0 auto;animation:in .4s var(--ease) both}
  @keyframes in{from{opacity:0;transform:translateY(.6em)}to{opacity:1;transform:none}}
  .eyebrow{color:var(--violet);font-size:.8em;letter-spacing:.1em;text-transform:uppercase}
  h1{margin:.1em 0 .3em;font-weight:500;font-size:1.9em;line-height:1.2}
  h2{margin:1.3em 0 .45em;font-weight:500;font-size:1.15em}
  p.lead{color:var(--muted);margin:.2em 0 1em;max-width:46em}
  .hint{color:var(--dim);font-size:.88em}
  .row{display:flex;gap:.7em 1em;flex-wrap:wrap;align-items:flex-end}
  .row>.field{flex:1 1 14em}
  .field{display:flex;flex-direction:column;gap:.3em;margin:.6em 0}
  .field>label,.lbl{font-weight:500;font-size:.95em}
  input[type=text],input[type=password],input[type=search],input[type=time],select{background:rgba(255,255,255,.06);border:1px solid var(--edge2);border-radius:.7em;padding:.55em .75em;min-height:2.7em;width:100%}
  input:focus,select:focus{border-color:var(--indigo);background:rgba(124,140,255,.1);outline:none}
  select option{background:#141735;color:#f4f5ff}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;background:rgba(255,255,255,.07);border:1px solid var(--edge2);border-radius:.8em;padding:.55em 1.15em;min-height:2.7em;cursor:pointer;transition:background .2s,transform .15s;text-decoration:none;color:var(--ink);white-space:nowrap}
  .btn:hover{background:rgba(124,140,255,.28)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(135deg,#7c8cff,#a78bfa);border:0;color:#fff;font-weight:500;box-shadow:0 6px 20px rgba(124,140,255,.35)}
  .btn.big{font-size:1.15em;padding:.75em 1.6em}
  .btn.ghost{background:none;border-color:transparent;color:var(--muted)}
  .btn.small{padding:.3em .75em;min-height:2.1em;font-size:.88em}
  .btn:disabled{opacity:.5;cursor:default}
  .btn .ext{opacity:.7;font-size:.85em}

  /* choice cards */
  .choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(14em,1fr));gap:.75em;margin:.7em 0}
  .choice{position:relative;display:flex;flex-direction:column;gap:.3em;text-align:left;background:var(--panel);border:1px solid var(--edge2);border-radius:1em;padding:.95em 1em;cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
  .choice:hover{background:var(--panel2);transform:translateY(-1px)}
  .choice.on{border-color:var(--indigo);background:linear-gradient(135deg,rgba(124,140,255,.24),rgba(167,139,250,.14));box-shadow:0 0 0 1px var(--indigo) inset}
  .choice .ic{font-size:1.6em;line-height:1}
  .choice b{font-weight:500;font-size:1.05em}
  .choice small{color:var(--muted);font-size:.86em}
  .tag{position:absolute;top:.7em;right:.75em;font-size:.72em;padding:.12em .55em;border-radius:1em;background:rgba(126,227,176,.18);color:var(--mint)}
  .tag.gold{background:rgba(255,210,122,.16);color:var(--gold)}
  .choices.wide{grid-template-columns:repeat(auto-fill,minmax(17em,1fr))}

  /* benefits */
  .benefits{display:grid;grid-template-columns:repeat(auto-fill,minmax(15em,1fr));gap:.55em;margin:.6em 0 1em}
  .benefit{display:flex;gap:.6em;align-items:flex-start;background:rgba(255,255,255,.035);border:1px solid var(--edge);border-radius:.9em;padding:.6em .75em;font-size:.93em}
  .benefit span{font-size:1.25em;line-height:1.2}

  /* notes */
  .note{background:rgba(124,140,255,.1);border:1px solid var(--edge2);border-radius:var(--r);padding:.7em .95em;margin:.8em 0;font-size:.93em}
  .note.warn{background:rgba(255,210,122,.08);border-color:rgba(255,210,122,.35)}
  .note.ok{background:rgba(126,227,176,.08);border-color:rgba(126,227,176,.35)}
  .msg{min-height:1.4em;margin:.5em 0;font-size:.95em}
  .msg.ok{color:var(--mint)} .msg.bad{color:var(--rose)} .msg.busy{color:var(--muted)}
  .status{display:inline-flex;align-items:center;gap:.35em;font-size:.85em;padding:.15em .7em;border-radius:1em;background:rgba(255,255,255,.06);color:var(--muted)}
  .status.ok{background:rgba(126,227,176,.15);color:var(--mint)}
  .status.bad{background:rgba(255,143,163,.15);color:var(--rose)}

  /* walkthrough: numbered steps with open-page buttons */
  .walk{list-style:none;counter-reset:w;padding:0;margin:.8em 0;display:flex;flex-direction:column;gap:.55em}
  .walk li{counter-increment:w;position:relative;padding:.7em .9em .7em 3.3em;background:var(--panel);border:1px solid var(--edge);border-radius:.95em}
  .walk li::before{content:counter(w);position:absolute;left:.8em;top:.65em;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c8cff,#a78bfa);color:#fff;font-weight:600;font-size:.9em}
  .walk li.done{opacity:.72}
  .walk li.done::before{content:"✓";background:var(--mint);color:#0b1a12}
  .walk li b{font-weight:500}
  .walk li .acts{display:flex;gap:.45em;flex-wrap:wrap;margin-top:.45em}
  .walk code,.code{background:rgba(0,0,0,.35);border:1px solid var(--edge);border-radius:.45em;padding:.1em .45em;font-family:Consolas,"Cascadia Mono",monospace;font-size:.92em;word-break:break-all}
  .codebox{display:flex;gap:.5em;align-items:center;margin-top:.4em}
  .codebox .code{flex:1;padding:.45em .65em}
  kbd{background:rgba(255,255,255,.1);border:1px solid var(--edge2);border-bottom-width:2px;border-radius:.35em;padding:0 .35em;font-family:inherit;font-size:.9em}
  .keybox{display:flex;gap:.5em;align-items:center}
  .keybox input{flex:1;font-family:Consolas,"Cascadia Mono",monospace}

  /* chips (interests) */
  .group{margin:.7em 0}
  .group h3{margin:.2em 0 .45em;font-weight:500;font-size:.9em;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
  .chips{display:flex;flex-wrap:wrap;gap:.45em}
  .chip{background:rgba(255,255,255,.06);border:1px solid var(--edge2);border-radius:2em;padding:.35em .95em;cursor:pointer;min-height:2.3em;display:inline-flex;align-items:center;gap:.4em;transition:background .2s}
  .chip:hover{background:rgba(124,140,255,.2)}
  .chip.on{background:linear-gradient(135deg,rgba(124,140,255,.55),rgba(167,139,250,.5));border-color:transparent;color:#fff}
  .sugg{display:flex;flex-direction:column;gap:.4em;margin:.5em 0}
  .sugg label{display:flex;gap:.6em;align-items:center;background:var(--panel);border:1px solid var(--edge);border-radius:.8em;padding:.5em .75em;cursor:pointer}
  .sugg input{width:1.15em;height:1.15em;accent-color:var(--violet)}
  .sugg small{color:var(--muted)}

  /* switches */
  .toggle{display:flex;gap:.9em;align-items:flex-start;background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:.7em .95em;margin:.5em 0}
  .toggle .txt{flex:1} .toggle .txt b{font-weight:500} .toggle .txt div{color:var(--muted);font-size:.88em}
  .sw{position:relative;flex:0 0 3em;height:1.7em;border-radius:1em;background:rgba(255,255,255,.12);border:1px solid var(--edge2);cursor:pointer;transition:background .2s;margin-top:.1em}
  .sw::after{content:"";position:absolute;top:.15em;left:.17em;width:1.3em;height:1.3em;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
  .sw[aria-checked=true]{background:linear-gradient(135deg,#7c8cff,#a78bfa);border-color:transparent}
  .sw[aria-checked=true]::after{transform:translateX(1.28em)}
  .seg{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid var(--edge2);border-radius:.75em;padding:.18em;gap:.15em}
  .seg button{background:none;border:0;border-radius:.55em;padding:.3em .8em;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:.9em}
  .seg button.on{background:linear-gradient(135deg,rgba(124,140,255,.55),rgba(167,139,250,.5));color:#fff}

  /* file & folder picker */
  .picker{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:.9em;margin:.8em 0}
  .pane{background:var(--panel);border:1px solid var(--edge2);border-radius:1em;display:flex;flex-direction:column;min-height:20em;max-height:28em;overflow:hidden}
  .pane header{display:flex;align-items:center;gap:.45em;padding:.55em .7em;border-bottom:1px solid var(--edge);flex-wrap:wrap}
  .crumbs{display:flex;gap:.15em;align-items:center;flex-wrap:wrap;min-width:0;font-size:.88em}
  .crumbs button{background:none;border:0;color:var(--muted);cursor:pointer;padding:.1em .3em;border-radius:.4em}
  .crumbs button:hover{color:var(--ink);background:rgba(255,255,255,.07)}
  .tree{overflow-y:auto;flex:1;padding:.3em}
  .node{display:flex;align-items:center;gap:.5em;padding:.35em .5em;border-radius:.6em}
  .node:hover{background:rgba(255,255,255,.05)}
  .node input{width:1.15em;height:1.15em;accent-color:var(--violet);flex:0 0 auto}
  .node .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .node .nm.file{cursor:default;color:var(--muted)}
  .node .meta{color:var(--dim);font-size:.78em;white-space:nowrap}
  .quick{display:flex;gap:.35em;flex-wrap:wrap;padding:.5em .7em;border-bottom:1px solid var(--edge)}
  .chosen{overflow-y:auto;flex:1;padding:.4em;display:flex;flex-direction:column;gap:.4em}
  .pick{display:flex;flex-direction:column;gap:.35em;background:rgba(255,255,255,.04);border:1px solid var(--edge);border-radius:.75em;padding:.5em .6em}
  .pick .p{display:flex;gap:.5em;align-items:center;min-width:0}
  .pick .p span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
  .pick .rm{background:none;border:0;color:var(--dim);cursor:pointer;font-size:1em}
  .pick .rm:hover{color:var(--rose)}
  .empty{color:var(--dim);font-size:.9em;padding:1em;text-align:center}
  .summary{background:rgba(126,227,176,.07);border:1px solid rgba(126,227,176,.3);border-radius:var(--r);padding:.7em .95em;margin:.8em 0;font-size:.95em;overflow-wrap:anywhere;min-width:0}
  .chip,.card h1,.card p,.card li{overflow-wrap:anywhere}

  /* app cards */
  .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(16em,1fr));gap:.75em;margin:.7em 0}
  .app{background:var(--panel);border:1px solid var(--edge2);border-radius:1em;padding:.85em .95em;display:flex;flex-direction:column;gap:.4em}
  .app .hd{display:flex;align-items:center;gap:.55em}
  .app .hd b{flex:1;font-weight:500}
  .app .logo{font-size:1.4em}
  .app p{margin:0;color:var(--muted);font-size:.88em}
  .app .acts{display:flex;gap:.4em;flex-wrap:wrap;margin-top:auto}
  .drawer{background:rgba(0,0,0,.2);border:1px solid var(--edge);border-radius:1em;padding:.4em 1em 1em;margin:.8em 0}

  /* voices */
  .voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(15em,1fr));gap:.5em;max-height:21em;overflow-y:auto;padding:.2em}
  .voice{display:flex;align-items:center;gap:.55em;background:var(--panel);border:1px solid var(--edge);border-radius:.85em;padding:.45em .6em;cursor:pointer}
  .voice.on{border-color:var(--indigo);background:rgba(124,140,255,.2)}
  .voice .g{flex:1;min-width:0} .voice .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .voice .d{color:var(--muted);font-size:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .play{flex:0 0 auto;width:2.2em;height:2.2em;border-radius:50%;border:1px solid var(--edge2);background:rgba(255,255,255,.06);cursor:pointer}
  .play:hover{background:rgba(124,140,255,.3)}
  .devs{display:flex;flex-direction:column;gap:.45em}
  .dev{display:flex;align-items:center;gap:.6em;background:var(--panel);border:1px solid var(--edge);border-radius:.85em;padding:.5em .75em;cursor:pointer}
  .dev.on{border-color:var(--indigo);background:rgba(124,140,255,.18)}
  .dev .g{flex:1;min-width:0}
  .screens{display:flex;gap:.8em;align-items:flex-end;flex-wrap:wrap;margin:.8em 0}
  .scr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;border:2px solid var(--edge2);border-radius:.5em;background:rgba(255,255,255,.04);cursor:pointer;padding:.4em;text-align:center;font-size:.85em;color:var(--muted)}
  .scr.on{border-color:var(--indigo);background:rgba(124,140,255,.2);color:#fff}
  .scr b{font-size:1.4em;color:var(--ink);font-weight:500}
  .results{display:flex;flex-direction:column;gap:.35em;margin:.4em 0}
  .results button{text-align:left}
  .sumlist{display:grid;grid-template-columns:max-content 1fr;gap:.4em 1.2em;background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:.9em 1.1em}
  .sumlist dt{color:var(--muted)} .sumlist dd{margin:0}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.6em;padding:1.5em 0 .5em}
  .hero .bigsun{width:6em;height:6em;border-radius:50%;background:radial-gradient(circle at 50% 65%,#ffe3a0,#ffd27a 30%,#a78bfa 72%,transparent 73%);box-shadow:0 0 60px rgba(167,139,250,.55),0 0 120px rgba(255,210,122,.25);animation:rise 1.8s var(--ease) both}
  @keyframes rise{from{transform:translateY(1.5em);opacity:0}to{transform:none;opacity:1}}
  .hero h1{font-size:2.3em}

  /* footer */
  footer{flex:0 0 auto;display:flex;align-items:center;gap:.6em;padding:.65em 1.2em;border-top:1px solid var(--edge);background:rgba(7,9,22,.65);backdrop-filter:blur(8px)}
  footer .sp{flex:1}
  .toast{position:fixed;left:50%;bottom:4.8em;transform:translate(-50%,1em);opacity:0;background:rgba(22,26,56,.96);border:1px solid var(--edge2);border-radius:.8em;padding:.5em 1em;transition:all .3s var(--ease);pointer-events:none;z-index:9}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  @media (max-width:760px){
    body{font-size:16px}
    .top{padding:.5em .8em;gap:.6em}
    .top .stepname{display:none}
    .guide{width:calc(100% - 1em);padding:.55em .65em;gap:.6em}
    .orb{flex-basis:2.4em;height:2.4em}
    .gbtn{width:2.2em;height:2.2em}
    main{padding:.9em .7em 1.4em}
    h1{font-size:1.5em}
    .hero h1{font-size:1.8em}
    .picker{grid-template-columns:1fr}
    footer{padding:.55em .7em}
    footer .hide-sm{display:none}
    .sumlist{grid-template-columns:1fr} .sumlist dd{margin-bottom:.4em}
  }
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><span class="sun" aria-hidden="true"></span>Dayspring</div>
    <div class="rail" id="rail" aria-hidden="true"></div>
    <span class="stepname" id="stepname"></span>
    <button class="link" id="restart" type="button" title="Start the setup over">Start over</button>
  </div>
  <section class="guide" id="guide" aria-label="Your guide">
    <div class="orb" aria-hidden="true"></div>
    <div class="cap"><small>Dayspring</small><p id="caption" aria-live="polite"></p></div>
    <div class="gbtns">
      <button class="gbtn" id="gPause" type="button" title="Pause" aria-label="Pause the guide">⏸</button>
      <button class="gbtn" id="gRepeat" type="button" title="Say that again" aria-label="Say that again">↻</button>
      <button class="gbtn" id="gMute" type="button" title="Mute the guide" aria-label="Mute the guide" aria-pressed="false">🔊</button>
    </div>
  </section>
  <main id="main" tabindex="-1"><div class="card" id="card"></div></main>
  <footer>
    <button class="btn ghost" id="back" type="button">← Back</button>
    <span class="sp"></span>
    <span class="hint hide-sm" id="where"></span>
    <button class="btn ghost" id="skip" type="button">Skip for now</button>
    <button class="btn primary" id="next" type="button">Next →</button>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/chips-input.js"></script>
  <script src="/voices.js"></script>
  <script src="/welcome.js"></script>
</body>
</html>
