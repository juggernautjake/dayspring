<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayspring History</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='20' r='9' fill='%237c8cff'/%3E%3Crect x='2' y='20' width='28' height='10' fill='%23070913'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{--bg:#070913;--ink:#eef0ff;--muted:#a4abcc;--dim:#8d94b8;--glass:rgba(22,26,52,.55);--edge:rgba(160,170,255,.14);--edge2:rgba(170,180,255,.28);--indigo:#7c8cff;--violet:#a78bfa;--mint:#7ee3b0;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:Outfit,"Segoe UI",sans-serif;font-weight:300;
    background:radial-gradient(1200px 700px at 15% -10%,rgba(91,108,255,.28),transparent 60%),radial-gradient(900px 600px at 95% 10%,rgba(167,139,250,.22),transparent 60%),var(--bg);background-attachment:fixed}
  main{max-width:980px;margin:0 auto;padding:32px 20px 80px}
  h1{font-weight:300;font-size:2.2rem;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 22px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .bar input{flex:1 1 260px;min-width:0;background:var(--glass);border:1px solid var(--edge2);border-radius:12px;padding:12px 14px;color:var(--ink);font:inherit;font-size:1rem;outline:none}
  .bar input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(167,139,250,.2)}
  .bar input[type=date]{flex:0 0 auto}
  .bar button{background:linear-gradient(135deg,var(--indigo),var(--violet));border:none;border-radius:12px;padding:0 18px;color:#fff;font:inherit;font-weight:500;cursor:pointer}
  .conv{background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:14px 16px;margin-bottom:12px;backdrop-filter:blur(14px);cursor:pointer;transition:border-color .2s,transform .2s}
  .conv:hover{border-color:var(--edge2);transform:translateY(-1px)}
  .conv .top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .conv .when{color:var(--dim);font-size:.9rem;white-space:nowrap}
  .conv .title{font-weight:500;flex:1;min-width:0}
  .conv .sum{color:var(--muted);margin:6px 0 0;font-size:.95rem}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:.75rem;padding:2px 9px;border-radius:20px;background:rgba(124,140,255,.14);border:1px solid rgba(124,140,255,.25);color:#cfd5ff}
  .chip.t{background:rgba(126,227,176,.12);border-color:rgba(126,227,176,.28);color:#bff3da}
  .quotes{margin-top:10px;display:grid;gap:6px}
  .q{font-size:.92rem;color:#d7dbf5}
  .q b{font-weight:500;color:var(--violet)} .q b.j{color:var(--mint)}
  .lines{margin-top:12px;border-top:1px solid var(--edge);padding-top:10px;display:grid;gap:8px}
  .line{display:grid;grid-template-columns:4.8em 6.5em 1fr;gap:10px;font-size:.95rem}
  .line .t{color:var(--dim)} .line .who{font-weight:500} .line.me .who{color:var(--mint)} .line.dayspring .who{color:var(--violet)} .line.event .who{color:#ffd27a}
  .line.event .txt{color:var(--muted);font-style:italic}
  .empty{color:var(--dim);text-align:center;padding:40px}
  @media (max-width:560px){.line{grid-template-columns:4.2em 1fr}.line .who{display:none}}
</style>
<script src="/theme-core.js"></script>
<script src="/theme.js"></script>
</head>
<body>
<main>
  <h1>Conversations</h1>
  <p class="sub">Everything you and Dayspring have said, with timestamps. Search by topic, keyword or anything either of you said.</p>
  <form class="bar" id="f">
    <input id="q" placeholder="Search: the dentist, my trip, what I said about the gym…" autocomplete="off">
    <input id="from" type="date" title="From"><input id="to" type="date" title="To">
    <button>Search</button>
  </form>
  <div id="out"></div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const when = (iso) => new Date(iso).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const time = (iso) => new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  const chips = (c) => `<div class="chips">${(c.topics ?? []).map((t) => `<span class="chip t">${esc(t)}</span>`).join("")}${(c.keywords ?? []).slice(0, 10).map((k) => `<span class="chip">${esc(k)}</span>`).join("")}</div>`;
  function card(c) {
    const quotes = (c.quotes ?? []).slice(0, 3).map((q) => `<div class="q"><b class="${q.who !== "Dayspring" ? "j" : ""}">${esc(q.who)}:</b> ${esc(q.text)}</div>`).join("");
    return `<div class="conv" data-id="${c.id}"><div class="top"><span class="when">${when(c.start)}</span><span class="title">${esc(c.title ?? "Conversation")}</span>${c.turns ? `<span class="when">${c.turns} lines</span>` : ""}</div>
      ${c.summary ? `<p class="sum">${esc(c.summary)}</p>` : ""}${chips(c)}${quotes ? `<div class="quotes">${quotes}</div>` : ""}<div class="lines" hidden></div></div>`;
  }
  async function load() {
    const p = new URLSearchParams();
    if ($("#q").value.trim()) p.set("q", $("#q").value.trim());
    if ($("#from").value) p.set("from", $("#from").value);
    if ($("#to").value) p.set("to", $("#to").value);
    const r = await fetch("/api/history?" + p).then((x) => x.json());
    const list = r.results ?? r.conversations ?? [];
    $("#out").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">${p.get("q") ? "Nothing matched that." : "No conversations saved yet. Talk to Dayspring and they'll show up here."}</div>`;
  }
  $("#out").addEventListener("click", async (e) => {
    const c = e.target.closest(".conv"); if (!c) return;
    const box = c.querySelector(".lines");
    if (!box.hidden) { box.hidden = true; return; }
    const conv = await fetch("/api/history/" + c.dataset.id).then((x) => x.json());
    // the owner's lines (role "user", or their name from older saves) show as "You"
    const mine = (r) => r !== "dayspring" && r !== "event" && r !== "assistant";
    box.innerHTML = conv.lines.map((l) => `<div class="line ${mine(l.role) ? "me" : l.role}"><span class="t">${time(l.at)}</span><span class="who">${mine(l.role) ? "You" : l.role === "event" ? "Dayspring ·" : "Dayspring"}</span><span class="txt">${esc(l.text)}</span></div>`).join("");
    box.hidden = false;
  });
  $("#f").onsubmit = (e) => { e.preventDefault(); load(); };
  load();
</script>
</body>
</html>
